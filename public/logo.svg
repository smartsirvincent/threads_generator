<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B6AA5"/>
      <stop offset="100%" stop-color="#1F3F6E"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#FF8C42"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B3D"/>
      <stop offset="100%" stop-color="#E94B26"/>
    </linearGradient>
  </defs>

  <!-- FUN text -->
  <text x="160" y="115" font-family="system-ui, sans-serif" font-weight="900" font-size="80" fill="url(#blueGrad)" text-anchor="middle" letter-spacing="-2">FUN</text>

  <!-- Big A in Ai -->
  <text x="118" y="280" font-family="system-ui, sans-serif" font-weight="900" font-size="190" fill="url(#blueGrad)" text-anchor="middle" letter-spacing="-4">A</text>

  <!-- lowercase i -->
  <rect x="220" y="170" width="22" height="100" rx="6" fill="url(#blueGrad)"/>
  <circle cx="231" cy="148" r="11" fill="url(#orange)"/>

  <!-- orange atom curve connecting two circles through A -->
  <path d="M 90 240 Q 140 130 240 105" stroke="url(#orange)" stroke-width="9" stroke-linecap="round" fill="none"/>

  <!-- big orange circle (upper right) -->
  <circle cx="240" cy="100" r="22" fill="url(#orange)"/>
  <!-- red circle (middle of A) -->
  <circle cx="120" cy="230" r="18" fill="url(#red)" stroke="white" stroke-width="3"/>
</svg>
